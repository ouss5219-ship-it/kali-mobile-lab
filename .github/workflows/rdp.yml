name: kaliouss

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kali-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Pull latest Kali Rolling
        run: |
          docker pull kalilinux/kali-rolling

      - name: Build Kali laboratory
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          cat > Dockerfile <<'EOF'
          FROM kalilinux/kali-rolling

          ENV DEBIAN_FRONTEND=noninteractive
          ENV LANG=C.UTF-8
          ENV LC_ALL=C.UTF-8

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                kali-desktop-xfce \
                tigervnc-standalone-server \
                novnc \
                websockify \
                dbus-x11 \
                sudo \
                ca-certificates \
                curl \
                wget \
                git \
                nano \
                vim \
                tmux \
                screen \
                htop \
                tree \
                unzip \
                zip \
                jq \
                net-tools \
                iproute2 \
                iputils-ping \
                dnsutils \
                whois \
                netcat-openbsd \
                socat \
                tcpdump \
                tshark \
                nmap \
                masscan \
                nikto \
                sqlmap \
                hydra \
                john \
                hashcat \
                gobuster \
                ffuf \
                wfuzz \
                feroxbuster \
                enum4linux-ng \
                exploitdb \
                seclists \
                metasploit-framework \
                burpsuite \
                python3 \
                python3-pip \
                python3-venv \
                python3-dev \
                && rm -rf /var/lib/apt/lists/*

          RUN useradd -m -s /bin/bash kali && \
              echo "kali ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/kali && \
              chmod 440 /etc/sudoers.d/kali

          RUN mkdir -p /home/kali/Desktop /home/kali/tools /home/kali/labs /home/kali/.vnc && \
              chown -R kali:kali /home/kali

          RUN echo "startxfce4" > /home/kali/.xsession && \
              chown kali:kali /home/kali/.xsession

          EXPOSE 6080

          CMD ["/bin/bash", "-c", \
            "su - kali -c 'mkdir -p /home/kali/.vnc && echo \"${RDP_PASS}\" | vncpasswd -f > /home/kali/.vnc/passwd && chmod 600 /home/kali/.vnc/passwd && rm -rf /tmp/.X11-unix/* /tmp/.X1-lock' && \
             su - kali -c 'vncserver :1 -geometry 1280x720 -depth 24' && \
             websockify --web=/usr/share/novnc/ 6080 localhost:5901"]
          EOF

          docker build \
            --progress=plain \
            -t kali-vnc-lab .

          docker run -d \
            --name kali-vnc-lab \
            --shm-size=8g \
            -p 127.0.0.1:6080:6080 \
            kali-vnc-lab

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        env:
          TS_AUTH_KEY: ${{ secrets.TS_AUTH_KEY }}
        run: |
          sudo tailscale up \
            --auth-key="$TS_AUTH_KEY" \
            --hostname="kaliouss-lab"

          echo "===== TAILSCALE STATUS ====="
          sudo tailscale status

          echo "===== TAILSCALE IPv4 ====="
          sudo tailscale ip -4

      - name: Publish VNC through Tailscale
        run: |
          sudo tailscale serve \
            --tcp=6080 \
            tcp://127.0.0.1:6080

          echo "===== TAILSCALE SERVE ====="
          sudo tailscale serve status

          echo "===== CONNECT USING TAILSCALE ====="
          sudo tailscale ip -4

      - name: Keep laboratory lab alive
        run: |
          echo "=============================================="
          echo "      KALIOUSS VNC LAB READY (NO-VNC)"
          echo "=============================================="
          echo "Access URL: http://<tailscale-ip>:6080/vnc.html"
          echo "=============================================="

          while true; do
            sleep 300
          done
          
