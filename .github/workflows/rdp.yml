name: kalii

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize System Memory (Add 8GB Swap)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TALESCALE_AUTH_KEY }}

      - name: Install Official Kali Desktop & Themes
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update
          sudo apt install -y wget gnupg
          wget -qO- https://archive.kali.org/archive-key.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/kali.gpg > /dev/null
          echo "deb http://http.kali.org/kali kali-rolling main non-free contrib" | sudo tee /etc/apt/sources.list.d/kali.list
          sudo apt update
          sudo -E apt install -y -o Dpkg::Options::="--force-confold" kali-themes kali-desktop-xfce tightvncserver git kali-linux-headless
          mkdir -p ~/.vnc
          echo "12345678" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          echo "#!/bin/bash" > ~/.vnc/xstartup
          echo "xrdb \$HOME/.Xresources" >> ~/.vnc/xstartup
          echo "startxfce4 &" >> ~/.vnc/xstartup
          chmod +x ~/.vnc/xstartup
          vncserver :1 -geometry 1280x720 -depth 24

      - name: Launch noVNC Web Server
        run: |
          git clone https://github.com/novnc/noVNC.git ~/noVNC
          git clone https://github.com/novnc/websockify ~/noVNC/utils/websockify
          chmod +x ~/noVNC/utils/novnc_proxy
          nohup ~/noVNC/utils/novnc_proxy --vnc localhost:5901 --listen 6080 > ~/novnc.log 2>&1 &
          sleep 5
          echo "=========================================="
          echo "Your Tailscale IP is: $(tailscale ip -4)"
          echo "=========================================="
          sleep 21600
          
